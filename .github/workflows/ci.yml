name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: python -m unittest neural.test_hardware neural.test_isolated_runtime
      - shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw $errors }
          }
      - run: python -m py_compile neural/server.py neural/parler_worker.py neural/clone_worker.py neural/transcribe_worker.py neural/build_previews.py scripts/download-models.py
